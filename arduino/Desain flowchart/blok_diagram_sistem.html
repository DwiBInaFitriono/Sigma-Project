<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Blok Diagram Sistem - Project SIGMA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            font-family: 'Times New Roman', Times, serif;
        }
        .container { width: 800px; }
        .caption {
            text-align: center;
            font-size: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman', Times, serif">

            <!-- Label Kolom -->
            <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="bold">Input</text>
            <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="bold">Proses</text>
            <text x="670" y="30" text-anchor="middle" font-size="15" font-weight="bold">Output</text>

            <!-- ======================== -->
            <!-- KOTAK INPUT              -->
            <!-- ======================== -->

            <!-- Sensor ADXL345 -->
            <rect x="30" y="70" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="130" y="100" text-anchor="middle" font-size="15" font-weight="bold">Sensor ADXL345</text>
            <text x="130" y="120" text-anchor="middle" font-size="13">(Akselerometer)</text>

            <!-- GPS Neo-6M -->
            <rect x="30" y="230" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="130" y="260" text-anchor="middle" font-size="15" font-weight="bold">GPS Neo-6M</text>
            <text x="130" y="280" text-anchor="middle" font-size="13">(Modul Lokasi)</text>

            <!-- ======================== -->
            <!-- GARIS INPUT → ESP32      -->
            <!-- ======================== -->

            <!-- Garis dari ADXL345 ke kanan -->
            <line x1="230" y1="105" x2="280" y2="105" stroke="#000" stroke-width="2"/>

            <!-- Garis dari GPS ke kanan -->
            <line x1="230" y1="265" x2="280" y2="265" stroke="#000" stroke-width="2"/>

            <!-- Garis vertikal penghubung (dari titik ADXL turun ke titik GPS) -->
            <line x1="280" y1="105" x2="280" y2="265" stroke="#000" stroke-width="2"/>

            <!-- Garis dari titik tengah vertikal ke ESP32 + panah -->
            <line x1="280" y1="185" x2="310" y2="185" stroke="#000" stroke-width="2"/>
            <polygon points="310,179 322,185 310,191" fill="#000"/>

            <!-- ======================== -->
            <!-- KOTAK PROSES (ESP32)     -->
            <!-- ======================== -->

            <rect x="322" y="135" width="156" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/>
            <text x="400" y="178" text-anchor="middle" font-size="17" font-weight="bold">ESP32</text>
            <text x="400" y="200" text-anchor="middle" font-size="13">(Mikrokontroler)</text>

            <!-- ======================== -->
            <!-- GARIS ESP32 → OUTPUT     -->
            <!-- ======================== -->

            <!-- Garis dari ESP32 ke kanan -->
            <line x1="478" y1="185" x2="520" y2="185" stroke="#000" stroke-width="2"/>

            <!-- Garis vertikal penghubung (dari titik Buzzer turun ke titik Server) -->
            <line x1="520" y1="105" x2="520" y2="265" stroke="#000" stroke-width="2"/>

            <!-- Garis ke Buzzer + panah -->
            <line x1="520" y1="105" x2="550" y2="105" stroke="#000" stroke-width="2"/>
            <polygon points="550,99 562,105 550,111" fill="#000"/>

            <!-- Garis ke Server + panah -->
            <line x1="520" y1="265" x2="550" y2="265" stroke="#000" stroke-width="2"/>
            <polygon points="550,259 562,265 550,271" fill="#000"/>

            <!-- ======================== -->
            <!-- KOTAK OUTPUT             -->
            <!-- ======================== -->

            <!-- Buzzer -->
            <rect x="562" y="70" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="662" y="100" text-anchor="middle" font-size="15" font-weight="bold">Buzzer</text>
            <text x="662" y="120" text-anchor="middle" font-size="13">(Alarm Peringatan)</text>

            <!-- Server / API -->
            <rect x="562" y="230" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="662" y="260" text-anchor="middle" font-size="15" font-weight="bold">Server / API</text>
            <text x="662" y="280" text-anchor="middle" font-size="13">(Laravel Backend)</text>

        </svg>

        <p class="caption">Gambar 3.2 Blok Diagram Sistem Project SIGMA</p>
    </div>
</body>
</html>
